<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Simple Logger</title>
</head>
<body>
    <div class="h-screen w-screen flex flex-col items-center justify-center gap-4 bg-gray-500">

        <div id="message_canvas" 
        class="bg-purple-400 border-4 border-indigo-400 
       w-3/4 h-64 p-4 rounded-lg overflow-y-auto text-white">messeges will be sent here</div>



        <div class="flex items-center gap-2">
            <input type="text" id="Messagefield" name="name" placeholder="type your message here"
            class="bg-rose-700 border-4 border-fuchsia-700 p-2 w-90 text-white rounded-lg 
            focus:outline-none focus:ring-2 focus:ring-pink-300">



        <input type="button" value="Log Message" id="text_input" 
        class="bg-pink-700 border-4 border-fuchsia-700 p-2 w-28 text-white rounded-lg cursor-pointer 
        hover:bg-pink-900 transition">
    </div>

    </div>

    <script src="index.js"></script>
</body>
</html>
